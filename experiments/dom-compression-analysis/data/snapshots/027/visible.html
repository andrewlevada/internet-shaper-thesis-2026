.TUXModal-overlay{

  justify-content:center;
  align-items:center;
  padding:16px;
  background-color:rgba(0, 0, 0, 0.5);
  background-color:var(--ui-sheet-backdrop-1);
  transition:opacity 120ms cubic-bezier(0.33, 0.86, 0.2, 1);
  opacity:0;
}

  opacity:0;
}

.TUXModal-overlay[data-transition-status="open"]{
  opacity:1;
